name: Build Daedalus Bridge Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag, for example v1.1.3"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a prerelease"
        required: false
        default: false
        type: boolean

concurrency:
  group: daedalus-bridge-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  godot-compatibility:
    name: Godot ${{ matrix.godot }} compatibility
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        godot:
          - "4.0.4"
          - "4.6.3"
    steps:
      - uses: actions/checkout@v4

      - name: Download official Godot editor
        shell: pwsh
        run: |
          $version = "${{ matrix.godot }}"
          $archiveName = "Godot_v$version-stable_win64.exe.zip"
          $downloadUrl = "https://github.com/godotengine/godot/releases/download/$version-stable/$archiveName"
          Invoke-WebRequest -Uri $downloadUrl -OutFile $archiveName
          Expand-Archive -LiteralPath $archiveName -DestinationPath godot-bin

      - name: Parse and enable Daedalus Bridge
        shell: pwsh
        run: |
          $godot = Get-ChildItem -LiteralPath godot-bin -Filter "Godot*_console.exe" | Select-Object -First 1
          if ($null -eq $godot) {
            throw "Godot console executable was not extracted."
          }
          $smokeRoot = Join-Path $env:RUNNER_TEMP "daedalus-bridge-${{ matrix.godot }}"
          $appDataRoot = Join-Path $smokeRoot "appdata"
          New-Item -ItemType Directory -Path (Join-Path $smokeRoot "addons") -Force | Out-Null
          New-Item -ItemType Directory -Path $appDataRoot -Force | Out-Null
          Copy-Item -LiteralPath project.godot -Destination (Join-Path $smokeRoot "project.godot")
          Copy-Item -LiteralPath addons/daedalus_bridge -Destination (Join-Path $smokeRoot "addons/daedalus_bridge") -Recurse
          $env:APPDATA = $appDataRoot
          $ErrorActionPreference = "Continue"
          $output = & $godot.FullName --headless --editor --path $smokeRoot --quit 2>&1
          $exitCode = $LASTEXITCODE
          $ErrorActionPreference = "Stop"
          $output | ForEach-Object { Write-Host $_ }
          $compileErrors = @($output | Where-Object {
            "$_" -match '(?i)parse error|compile error|failed to load script|invalid call'
          })
          # Godot 4.0's Windows headless editor returns 1 even for an empty project.
          if ($exitCode -notin @(0, 1) -or $compileErrors.Count -gt 0) {
            throw "Daedalus Bridge failed to load in Godot ${{ matrix.godot }} (exit $exitCode, compile errors $($compileErrors.Count))."
          }

  release:
    needs: godot-compatibility
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan Godot 4.0 Bridge source
        shell: pwsh
        run: ./scripts/test-bridge-source.ps1

      - name: Build Bridge archive
        shell: pwsh
        run: ./scripts/build-bridge-release.ps1

      - name: Verify Studio-compatible release package
        shell: pwsh
        env:
          EXPECTED_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
        run: |
          $manifestPath = Get-ChildItem -LiteralPath release -Filter "*.manifest.json" | Select-Object -First 1
          if ($null -eq $manifestPath) {
            throw "Plugin release manifest was not produced."
          }
          $manifest = Get-Content -LiteralPath $manifestPath.FullName -Raw | ConvertFrom-Json
          $pluginMetadata = Get-Content -LiteralPath addons/daedalus_bridge/daedalus-bridge.json -Raw | ConvertFrom-Json
          if ($env:EXPECTED_RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$') {
            throw "Release tag must use v-prefixed semantic versioning: $env:EXPECTED_RELEASE_TAG"
          }
          if ("v$($manifest.bridgeVersion)" -ne $env:EXPECTED_RELEASE_TAG) {
            throw "Release tag $env:EXPECTED_RELEASE_TAG does not match Bridge version v$($manifest.bridgeVersion)."
          }
          if ($manifest.bridgeVersion -ne $pluginMetadata.bridgeVersion -or $manifest.bridgeProtocolVersion -ne $pluginMetadata.bridgeProtocolVersion) {
            throw "Release manifest does not match daedalus-bridge.json."
          }
          if ($manifest.studioVersion -ne $pluginMetadata.studioVersion -or $manifest.minGodotVersion -ne $pluginMetadata.minGodotVersion) {
            throw "Release compatibility metadata does not match daedalus-bridge.json."
          }
          if ($manifest.archive.fileName -ne "daedalus-bridge-v$($manifest.bridgeVersion).zip") {
            throw "Unexpected Daedalus Bridge archive name."
          }
          $archivePath = Join-Path release $manifest.archive.fileName
          if (-not (Test-Path -LiteralPath $archivePath -PathType Leaf)) {
            throw "Plugin archive was not produced."
          }
          if ((Get-FileHash -LiteralPath $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $manifest.archive.sha256) {
            throw "Plugin archive hash verification failed."
          }
          Add-Type -AssemblyName System.IO.Compression
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archivePath))
          try {
            $entries = @($archive.Entries | ForEach-Object { $_.FullName })
            if ($entries -notcontains "addons/daedalus_bridge/plugin.cfg") {
              throw "Bridge archive does not contain addons/daedalus_bridge/plugin.cfg."
            }
            if ($entries | Where-Object { $_ -match '(^|/)\.\.?($|/)' -or -not $_.StartsWith('addons/daedalus_bridge/') }) {
              throw "Bridge archive contains an unsafe path."
            }
            foreach ($file in $manifest.files) {
              if ($entries -notcontains $file.path) {
                throw "Plugin archive is missing manifest file $($file.path)."
              }
            }
          } finally {
            $archive.Dispose()
          }

      - uses: actions/upload-artifact@v4
        with:
          name: daedalus-bridge
          path: release/*
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          target_commitish: ${{ github.sha }}
          name: Daedalus Bridge ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag_name }}
          draft: ${{ github.event_name == 'workflow_dispatch' && inputs.draft || false }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          overwrite_files: true
          files: release/*
